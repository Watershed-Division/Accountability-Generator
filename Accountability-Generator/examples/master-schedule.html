<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Schedule (Example)</title>
<style>
:root{
  --bg:#424242; --panel:#D3D3D1; --ink:#1B2433; --muted:#4A4A48; --line:#A9A9A7;
  --purple:#4B0082; --purple-ink:#FFFFFF; --today:#EDE3F6; --chip:#FFFFFF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#424242; --panel:#2B2B2B; --ink:#E3E8EF; --muted:#A8A8A6; --line:#4A4A4A;
    --today:#3A2A4A; --chip:#3A3A3A; color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Calibri,Arial,sans-serif}
header{background:var(--purple);color:var(--purple-ink);padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
header h1{font-size:20px;margin:0;font-weight:600}
.spacer{flex:1}
button{font:inherit;color:var(--purple-ink);background:transparent;border:1px solid rgba(255,255,255,.55);border-radius:4px;padding:6px 12px;cursor:pointer}
button:hover{border-color:#fff}
:focus-visible{outline:2px solid #86AEF2;outline-offset:2px}
.banner{max-width:1200px;margin:16px auto 0;padding:0 24px}
.banner p{margin:0;background:#FFF4D6;color:#5A4300;border:1px solid #E5CF8F;border-radius:6px;padding:10px 14px;font-size:13px}
main{max-width:1200px;margin:16px auto 24px;padding:0 24px}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;overflow-x:auto}
.month{font-size:18px;font-weight:600;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);min-width:780px}
.dow{font-size:12px;font-weight:600;color:var(--muted);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.day{min-height:96px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.day.out{opacity:.4}
.day.today{background:var(--today)}
.num{font-size:12px;font-weight:600;margin-bottom:4px}
.ev{display:block;font-size:12px;line-height:1.3;background:var(--chip);border-left:3px solid var(--purple);border-radius:3px;padding:3px 6px;margin-top:4px}
.ev.maint{border-left-color:#B4441C}
.ev.train{border-left-color:#2F6FDB}
.ev.off{border-left-color:#3C8D5A}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:2px;background:var(--c)}
</style>
</head>
<body>
<header>
  <h1>Master Schedule</h1>
  <span class="spacer"></span>
  <button type="button" id="prev" aria-label="Previous month">‹ Prev</button>
  <button type="button" id="todayBtn">Today</button>
  <button type="button" id="next" aria-label="Next month">Next ›</button>
</header>

<div class="banner"><p><b>Example page.</b> This stands in for your team’s real schedule (Confluence, SharePoint, Outlook calendar, etc.). Point the “Master Schedule” link in the generator’s config at the real one. All events here are made up.</p></div>

<main>
  <section>
    <h2 class="month" id="monthTitle"></h2>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span style="--c:#4B0082">Team events</span>
      <span style="--c:#2F6FDB">Training</span>
      <span style="--c:#B4441C">Maintenance windows</span>
      <span style="--c:#3C8D5A">Holidays / time off</span>
    </div>
  </section>
</main>

<script>
(function(){
  "use strict";
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var now = new Date();
  var view = new Date(now.getFullYear(), now.getMonth(), 1);

  // Fictional, recurring sample events so the page always looks populated.
  function eventsFor(d){
    var ev = [], dow = d.getDay(), dom = d.getDate();
    if (dow === 1) ev.push(["Weekly team sync", ""]);
    if (dow === 3 && dom <= 7) ev.push(["Monthly all-hands", ""]);
    if (dow === 4 && dom > 7 && dom <= 14) ev.push(["Scheduled maintenance window", "maint"]);
    if (dow === 2 && dom > 14 && dom <= 21) ev.push(["Training block: tooling refresher", "train"]);
    if (dow === 3 && dom > 14 && dom <= 21) ev.push(["Training block: tooling refresher", "train"]);
    if (dow === 5 && dom > 21 && dom <= 28) ev.push(["Example holiday / family day", "off"]);
    if (dom === 10) ev.push(["Quarterly report due", ""]);
    return ev;
  }

  function render(){
    document.getElementById("monthTitle").textContent = MONTHS[view.getMonth()] + " " + view.getFullYear();
    var grid = document.getElementById("grid");
    grid.innerHTML = "";
    DOW.forEach(function(d){ var h = document.createElement("div"); h.className = "dow"; h.textContent = d; grid.appendChild(h); });
    var start = new Date(view); start.setDate(1 - view.getDay());
    for (var i = 0; i < 42; i++) {
      var d = new Date(start); d.setDate(start.getDate() + i);
      var cell = document.createElement("div");
      cell.className = "day";
      if (d.getMonth() !== view.getMonth()) cell.className += " out";
      if (d.toDateString() === now.toDateString()) cell.className += " today";
      var n = document.createElement("div"); n.className = "num"; n.textContent = d.getDate(); cell.appendChild(n);
      if (d.getDay() !== 0 && d.getDay() !== 6) {
        eventsFor(d).forEach(function(e){
          var s = document.createElement("span"); s.className = "ev " + e[1]; s.textContent = e[0]; cell.appendChild(s);
        });
      }
      grid.appendChild(cell);
      if (i >= 34 && d.getMonth() !== view.getMonth() && d.getDay() === 6) break;
    }
  }

  document.getElementById("prev").addEventListener("click", function(){ view.setMonth(view.getMonth() - 1); render(); });
  document.getElementById("next").addEventListener("click", function(){ view.setMonth(view.getMonth() + 1); render(); });
  document.getElementById("todayBtn").addEventListener("click", function(){ view = new Date(now.getFullYear(), now.getMonth(), 1); render(); });
  render();
})();
</script>
</body>
</html>
